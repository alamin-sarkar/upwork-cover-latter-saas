[project]
name = "upwork-cover-letter-api"
version = "0.1.0"
description = "FastAPI backend for the Upwork Cover Letter AI SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-workflows",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "anthropic>=0.39",
    "langchain>=0.3",
    "langgraph>=0.2.50",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
ai-workflows = { path = "../../packages/ai-workflows" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
