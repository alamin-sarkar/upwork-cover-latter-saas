services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pitchcraft-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cover_letter
    ports:
      - "5432:5432"
    volumes:
      - pitchcraft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cover_letter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pitchcraft-redis
    ports:
      - "6379:6379"
    volumes:
      - pitchcraft_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pitchcraft_pg:
  pitchcraft_redis:
